name: Generate TOC
on:
    workflow_dispatch:
jobs:
  generate-toc:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"
    
    - name: Generate TOC
      run: python generate_toc.py
    
    - name: Debug - Check file exists and content
      run: |
        echo "=== Checking if docs/TOC.md exists ==="
        ls -lah docs/TOC.md || echo "File does not exist!"
        echo ""
        echo "=== First 20 lines of generated TOC ==="
        head -n 20 docs/TOC.md || echo "Cannot read file!"
        echo ""
        echo "=== Git status ==="
        git status
        echo ""
        echo "=== Git diff ==="
        git diff docs/TOC.md
    
    - name: Commit TOC
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/TOC.md
        if git diff --cached --quiet; then
          echo "No changes detected - file is identical to previous version"
        else
          echo "Changes detected - committing..."
          git commit -m "Update TOC [skip ci]"
          git push
          echo "Pushed successfully!"
        fi
