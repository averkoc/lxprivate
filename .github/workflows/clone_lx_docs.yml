name: Sync docs from lx

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Clone source repo lx
        run: git clone https://github.com/averkoc/lx.git source

      - name: Sync docs safely
        run: |
          # Default excludes
          EXCLUDES=(
            "_config.yml"
          )

          # Add your own excludes here
          # EXCLUDES+=("private/")
          # EXCLUDES+=("dont-touch.md")

          # Build rsync exclude args
          EXCLUDE_ARGS=""
          for item in "${EXCLUDES[@]}"; do
            EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude=$item"
          done

          # -a  archive mode
          # -v  verbose
          # -u  update: skip files that are newer on the receiver
          # NO --delete, so target-only files stay
          rsync -avu $EXCLUDE_ARGS source/docs/ docs/

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Sync docs"
          git push
