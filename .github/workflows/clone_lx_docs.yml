name: Sync docs from lx

on:
  workflow_dispatch:   # Manual trigger
  schedule:
    - cron: "0 6 * * *"   # Daily at 06:00 UTC

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v3

      - name: Clone source repo
        run: git clone https://github.com/averkoc/lx.git source

      - name: Copy folder contents
        run: |
          mkdir -p docs
          cp -r source/docs/* docs/

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git commit -m "Sync docs folder from source repo" || echo "No changes"

      - name: Push with PAT
        env:
          TOKEN: ${{ secrets.PAT_PUSH }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_PUSH }}@github.com/averkoc/lxprivate.git

          git push origin main
