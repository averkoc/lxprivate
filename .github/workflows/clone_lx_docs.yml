name: Sync docs from lx

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write   # allow pushing commits

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lxprivate
        uses: actions/checkout@v3
        with:
          ref: main   # or master

      - name: Clone source repo lx
        run: git clone https://github.com/averkoc/lx.git source

      - name: Copy docs folder
        run: |
          mkdir -p docs
          cp -r source/docs/* docs/

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git commit -m "Sync docs folder from lx" || echo "No changes"

      - name: Push changes
        run: git push origin HEAD:main
