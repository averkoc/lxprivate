name: Sync docs from lx

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Checkout the TARGET repo (the one this workflow runs in)
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: main

      # Checkout the SOURCE repo (private or public)
      - name: Checkout source repo lx
        uses: actions/checkout@v4
        with:
          repository: averkoc/lx
          token: ${{ secrets.GITHUB_TOKEN }}
          path: source

      # Safe sync using rsync
      - name: Sync docs safely
        run: |
          # Default excludes
          EXCLUDES=(
            "_config.yml"
          )

          # Add your own excludes here if needed
          # EXCLUDES+=("private/")
          # EXCLUDES+=("dont-touch.md")

          # Build rsync exclude args
          EXCLUDE_ARGS=""
          for item in "${EXCLUDES[@]}"; do
            EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude=$item"
          done

          # rsync flags:
          # -a  archive mode (permissions, timestamps, etc.)
          # -v  verbose
          # -u  update: skip files that are newer on the target
          # NO --delete: keeps target-only files
          rsync -avu $EXCLUDE_ARGS source/docs/ docs/

      # Commit only if there are changes
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Sync docs"
          git push
