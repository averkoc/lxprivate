# Wrangler configuration for LXCheck Results API
# This file configures Cloudflare Pages Functions and D1 database binding

name = "lxprivate"
compatibility_date = "2024-01-01"

# Pages configuration - set to your Pages root directory
pages_build_output_dir = "docs/_site"

# D1 Database binding
 [[d1_databases]]
 binding = "DB"  # This is the variable name used in your code (context.env.DB)
 database_name = "lxcheck-results"
 database_id = "f48cc268-0cf3-412d-90d8-07cfa309a2bd"

# Environment variables (set these in Cloudflare Pages dashboard)
# LXCHECK_API_TOKEN - Bearer token for API authentication
